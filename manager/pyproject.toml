[project]
name = "sitemanager"
version = "0.1.0"
description = "Local web app for maintaining the content and style of Daan Cornelisse's website"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.161.1",
    "jinja2>=3.1.6",
    "pillow>=13.0.0",
    "python-dotenv>=1.2.4",
    "python-multipart>=0.0.32",
    "ruamel-yaml>=0.19.1",
    "uvicorn[standard]>=0.54.0",
]

[project.scripts]
sitemanager = "sitemanager.main:run"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.1.1",
    "ruff>=0.17.2",
]
